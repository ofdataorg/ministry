{{ define "main" }}
<section class="hero">
  <div class="wrap hero__in">
    <p class="hero__eyebrow"><span class="tag tag--hot">404</span> Not on file</p>
    <h1 class="hero__title">No such record</h1>
    <p class="hero__lede">That page isn't in the archive. It may have been renamed, or it may never have made it past review.</p>
    <div class="hero__cta">
      <a class="btn btn--hot" href="{{ "evaluations" | relURL }}">Browse the evaluations</a>
      <a class="btn btn--ghost" href="{{ site.Home.RelPermalink }}">Back to the front</a>
    </div>
  </div>
</section>
{{ end }}
